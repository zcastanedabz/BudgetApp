<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Budget Tracker</title>
<style>
  :root {
    --bg: #0D1117;
    --surface: #161B22;
    --surface2: #1E2530;
    --border: #2A3141;
    --teal: #00C896;
    --teal-dim: rgba(0,200,150,0.12);
    --red: #FF4F4F;
    --red-dim: rgba(255,79,79,0.12);
    --amber: #FFB020;
    --amber-dim: rgba(255,176,32,0.12);
    --text: #F0F4F8;
    --text2: #8B95A3;
    --text3: #4A5568;
    --safe-top: env(safe-area-inset-top, 44px);
    --safe-bottom: env(safe-area-inset-bottom, 34px);
    --tab-h: 72px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; overflow: hidden; }

  /* Layout */
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  #header { padding: calc(var(--safe-top) + 12px) 20px 12px; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  #header .subtitle { font-size: 13px; color: var(--text2); margin-top: 2px; }
  #content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--tab-h) + var(--safe-bottom) + 16px); }
  #tabs { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--tab-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: rgba(13,17,23,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: var(--text3); transition: color 0.15s; padding-top: 8px; }
  .tab.active { color: var(--teal); }
  .tab svg { width: 24px; height: 24px; }
  .tab span { font-size: 10px; font-weight: 500; }
  .page { display: none; padding: 16px 16px 0; }
  .page.active { display: block; }

  /* Cards */
  .card { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; }
  .card-header { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: center; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
  .card-action { font-size: 13px; color: var(--teal); font-weight: 500; cursor: pointer; padding: 4px 8px; }

  /* Dashboard ring */
  .ring-wrap { display: flex; flex-direction: column; align-items: center; padding: 20px 16px 16px; }
  .ring-svg { width: 160px; height: 160px; }
  .ring-track { fill: none; stroke: var(--surface2); stroke-width: 14; }
  .ring-fill { fill: none; stroke-width: 14; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1), stroke 0.3s; }
  .ring-label { text-anchor: middle; dominant-baseline: middle; }
  .ring-amount { font-size: 26px; font-weight: 700; fill: var(--text); }
  .ring-sub { font-size: 12px; fill: var(--text2); }
  .ring-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); margin-top: 4px; }
  .ring-stat { background: var(--surface); padding: 12px 8px; text-align: center; }
  .ring-stat .val { font-size: 16px; font-weight: 600; }
  .ring-stat .lbl { font-size: 10px; color: var(--text2); margin-top: 2px; }

  /* Category rows */
  .cat-row { display: flex; align-items: center; padding: 11px 16px; border-top: 1px solid var(--border); gap: 10px; cursor: pointer; }
  .cat-row:active { background: var(--surface2); }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cat-info { flex: 1; min-width: 0; }
  .cat-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-meta { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .cat-right { text-align: right; flex-shrink: 0; }
  .cat-bal { font-size: 14px; font-weight: 600; }
  .cat-spent { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .mini-bar { height: 3px; border-radius: 2px; background: var(--surface2); margin-top: 6px; overflow: hidden; }
  .mini-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

  /* Section label */
  .section-label { font-size: 12px; font-weight: 600; color: var(--text2); padding: 16px 4px 6px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Log page */
  .log-form { padding: 16px; }
  .field-group { margin-bottom: 14px; }
  .field-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
  select, input[type=number], input[type=text], textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 16px; padding: 12px 14px; outline: none; -webkit-appearance: none; appearance: none;
    font-family: inherit;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--teal); }
  textarea { resize: none; min-height: 72px; font-size: 15px; }
  .btn { display: block; width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .btn:active { opacity: 0.8; }
  .btn-primary { background: var(--teal); color: #0D1117; }
  .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); margin-top: 10px; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); margin-top: 10px; }
  .amount-row { display: flex; align-items: center; gap: 8px; }
  .amount-row .currency { font-size: 20px; color: var(--text2); padding-left: 4px; }

  /* History */
  .tx-row { display: flex; align-items: flex-start; padding: 13px 16px; border-top: 1px solid var(--border); gap: 12px; }
  .tx-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-cat { font-size: 14px; font-weight: 500; }
  .tx-note { font-size: 12px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-date { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .tx-amount { font-size: 15px; font-weight: 600; color: var(--red); flex-shrink: 0; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* Settings */
  .settings-row { display: flex; align-items: center; padding: 13px 16px; border-top: 1px solid var(--border); gap: 12px; }
  .settings-row:active { background: var(--surface2); }
  .settings-label { flex: 1; font-size: 15px; }
  .settings-val { font-size: 15px; color: var(--teal); font-weight: 500; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; padding-bottom: var(--safe-bottom); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; padding: 20px 20px calc(20px + var(--safe-bottom)); max-height: 85vh; overflow-y: auto; }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }

  /* Toast */
  .toast { position: fixed; top: calc(var(--safe-top) + 60px); left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 500; z-index: 300; opacity: 0; transition: all 0.25s; white-space: nowrap; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Colors */
  .c-teal { color: var(--teal); }
  .c-red { color: var(--red); }
  .c-amber { color: var(--amber); }
  .bg-teal { background: var(--teal); }
  .bg-red { background: var(--red); }
  .bg-amber { background: var(--amber); }

  /* History date group */
  .date-group { font-size: 12px; color: var(--text2); padding: 12px 16px 4px; font-weight: 600; }

  /* Budget total pill */
  .budget-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--teal-dim); border: 1px solid rgba(0,200,150,0.3); border-radius: 20px; padding: 4px 12px; font-size: 13px; color: var(--teal); font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h1 id="header-title">Budget Tracker</h1>
        <div class="subtitle" id="header-sub">Loading...</div>
      </div>
      <div class="budget-pill" id="header-pill">$0</div>
    </div>
  </div>

  <div id="content">
    <!-- DASHBOARD -->
    <div class="page active" id="page-dashboard">
      <div class="card">
        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 160 160">
            <circle class="ring-track" cx="80" cy="80" r="66"/>
            <circle class="ring-fill" id="ring-fill" cx="80" cy="80" r="66" stroke="#00C896" stroke-dasharray="414.69" stroke-dashoffset="414.69"/>
            <text class="ring-label ring-amount" x="80" y="74" id="ring-spent">$0</text>
            <text class="ring-label ring-sub" x="80" y="94" id="ring-label">of $0 budget</text>
          </svg>
        </div>
        <div class="ring-stats">
          <div class="ring-stat">
            <div class="val c-teal" id="stat-balance">$0</div>
            <div class="lbl">Remaining</div>
          </div>
          <div class="ring-stat">
            <div class="val" id="stat-spent">$0</div>
            <div class="lbl">Spent</div>
          </div>
          <div class="ring-stat">
            <div class="val" id="stat-pct">0%</div>
            <div class="lbl">Used</div>
          </div>
        </div>
      </div>

      <div class="section-label">Needs</div>
      <div class="card" id="needs-card"></div>

      <div class="section-label">Savings & Debt</div>
      <div class="card" id="savings-card"></div>

      <div class="section-label">Wants</div>
      <div class="card" id="wants-card"></div>
    </div>

    <!-- LOG EXPENSE -->
    <div class="page" id="page-log">
      <div class="log-form">
        <div class="field-group">
          <div class="field-label">Category</div>
          <select id="log-cat"></select>
        </div>
        <div class="field-group">
          <div class="field-label">Amount</div>
          <div class="amount-row">
            <span class="currency">$</span>
            <input type="number" id="log-amount" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
          </div>
        </div>
        <div class="field-group">
          <div class="field-label">Note (optional)</div>
          <textarea id="log-note" placeholder="What was this for?"></textarea>
        </div>
        <button class="btn btn-primary" onclick="logExpense()">Add Expense</button>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="page" id="page-history">
      <div id="history-list"></div>
    </div>

    <!-- SETTINGS -->
    <div class="page" id="page-settings">
      <div class="section-label">Budget</div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Total Budget</span>
          <span class="card-action" onclick="openEditBudget()">Edit</span>
        </div>
        <div class="settings-row" style="border:none;">
          <span class="settings-label">Monthly Budget</span>
          <span class="settings-val" id="set-budget">$0</span>
        </div>
      </div>

      <div class="section-label">Categories</div>
      <div class="card" id="cat-settings-list"></div>

      <div class="section-label">Danger Zone</div>
      <div class="card">
        <div style="padding:16px;">
          <button class="btn btn-danger" onclick="confirmReset()">Reset All Transactions</button>
          <button class="btn btn-ghost" onclick="confirmResetAll()">Reset Everything</button>
        </div>
      </div>
    </div>
  </div>

  <div id="tabs">
    <div class="tab active" onclick="switchTab('dashboard',this)" id="tab-dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span>Overview</span>
    </div>
    <div class="tab" onclick="switchTab('log',this)" id="tab-log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Log</span>
    </div>
    <div class="tab" onclick="switchTab('history',this)" id="tab-history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3h6l2 9 2-6h6"/><polyline points="3 3 3 20 21 20"/></svg>
      <span>History</span>
    </div>
    <div class="tab" onclick="switchTab('settings',this)" id="tab-settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </div>
  </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modal-cat" onclick="closeModal('modal-cat')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-cat-title">Edit Category</div>
    <div class="field-group">
      <div class="field-label">Budget Amount</div>
      <div class="amount-row">
        <span class="currency">$</span>
        <input type="number" id="modal-cat-amount" min="0" step="1" inputmode="decimal">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-cat')">Cancel</button>
      <button class="btn btn-primary" onclick="saveCatBudget()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-budget" onclick="closeModal('modal-budget')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">Total Monthly Budget</div>
    <div class="field-group">
      <div class="field-label">Amount</div>
      <div class="amount-row">
        <span class="currency">$</span>
        <input type="number" id="modal-budget-amount" min="0" step="50" inputmode="decimal">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-budget')">Cancel</button>
      <button class="btn btn-primary" onclick="saveBudget()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-confirm" onclick="closeModal('modal-confirm')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-confirm-title">Are you sure?</div>
    <p style="color:var(--text2);font-size:14px;margin-bottom:20px;" id="modal-confirm-msg"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-confirm')">Cancel</button>
      <button class="btn btn-danger" id="modal-confirm-btn">Reset</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const DEFAULT_CATEGORIES = [
  // Needs
  { id:'rent',     name:'Rent / Mortgage',       section:'needs',   budget:500,  emoji:'🏠' },
  { id:'util',     name:'Utilities',              section:'needs',   budget:140,  emoji:'💡' },
  { id:'groc',     name:'Groceries',              section:'needs',   budget:600,  emoji:'🛒' },
  { id:'gas',      name:'Transportation (Gas)',   section:'needs',   budget:200,  emoji:'⛽' },
  { id:'ins',      name:'Car Insurance',          section:'needs',   budget:30,   emoji:'🚗' },
  { id:'lic',      name:'Car License',            section:'needs',   budget:20,   emoji:'📄' },
  { id:'pets',     name:'Pets',                   section:'needs',   budget:100,  emoji:'🐾' },
  // Savings & Debt
  { id:'sind',     name:'Sindicato',              section:'savings', budget:450,  emoji:'🏦' },
  { id:'emerg',    name:'Emergency / Savings',    section:'savings', budget:500,  emoji:'🛡️' },
  { id:'baby',     name:'Baby Fund',              section:'savings', budget:100,  emoji:'👶' },
  { id:'debt',     name:'Debt Repayment – Ang',   section:'savings', budget:300,  emoji:'💳' },
  // Wants
  { id:'parta',    name:'Partner A – Discretionary', section:'wants', budget:230, emoji:'👤' },
  { id:'partb',    name:'Partner B – Discretionary', section:'wants', budget:230, emoji:'👥' },
];

const SECTION_COLORS = {
  needs:   '#00C896',
  savings: '#4F9EFF',
  wants:   '#B48EFF',
};

let state = {
  budget: 3400,
  categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
  transactions: [],
};

let editingCatId = null;

// ── Storage ────────────────────────────────────────────────────────────────
function save() {
  try { localStorage.setItem('bt_state', JSON.stringify(state)); } catch(e) {}
}

function load() {
  try {
    const raw = localStorage.getItem('bt_state');
    if (raw) {
      const saved = JSON.parse(raw);
      state = { ...state, ...saved };
      // Ensure all default categories exist
      DEFAULT_CATEGORIES.forEach(def => {
        if (!state.categories.find(c => c.id === def.id)) {
          state.categories.push({ ...def });
        }
      });
    }
  } catch(e) {}
}

// ── Computed ───────────────────────────────────────────────────────────────
function spentFor(catId) {
  return state.transactions.filter(t => t.catId === catId).reduce((s,t) => s + t.amount, 0);
}

function totalSpent() {
  return state.transactions.reduce((s,t) => s + t.amount, 0);
}

function totalBudget() {
  return state.categories.reduce((s,c) => s + c.budget, 0);
}

// ── Render ─────────────────────────────────────────────────────────────────
function fmt(n) {
  return '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
}

function renderDashboard() {
  const spent = totalSpent();
  const budget = totalBudget();
  const balance = budget - spent;
  const pct = budget > 0 ? Math.min(spent / budget, 1) : 0;

  // Ring
  const circ = 2 * Math.PI * 66;
  const offset = circ * (1 - pct);
  const fill = document.getElementById('ring-fill');
  fill.style.strokeDashoffset = offset;
  fill.style.stroke = pct >= 1 ? '#FF4F4F' : pct >= 0.9 ? '#FFB020' : '#00C896';

  document.getElementById('ring-spent').textContent = fmt(spent);
  document.getElementById('ring-label').textContent = `of ${fmt(budget)} budget`;
  document.getElementById('stat-balance').textContent = fmt(balance);
  document.getElementById('stat-balance').className = 'val ' + (balance < 0 ? 'c-red' : 'c-teal');
  document.getElementById('stat-spent').textContent = fmt(spent);
  document.getElementById('stat-pct').textContent = Math.round(pct * 100) + '%';

  // Header
  document.getElementById('header-title').textContent = 'Budget Tracker';
  document.getElementById('header-sub').textContent = new Date().toLocaleDateString('en-US', {month:'long', year:'numeric'});
  document.getElementById('header-pill').textContent = fmt(budget);

  // Category cards
  ['needs','savings','wants'].forEach(section => {
    const card = document.getElementById(section === 'needs' ? 'needs-card' : section === 'savings' ? 'savings-card' : 'wants-card');
    const cats = state.categories.filter(c => c.section === section);
    const color = SECTION_COLORS[section];
    card.innerHTML = cats.map(cat => {
      const s = spentFor(cat.id);
      const b = cat.budget;
      const bal = b - s;
      const p = b > 0 ? Math.min(s / b, 1) : 0;
      const barColor = p >= 1 ? 'var(--red)' : p >= 0.9 ? 'var(--amber)' : color;
      const balColor = bal < 0 ? 'c-red' : bal === b ? 'c-teal' : '';
      return `<div class="cat-row" onclick="openCatDetail('${cat.id}')">
        <div class="cat-dot" style="background:${color}"></div>
        <div class="cat-info">
          <div class="cat-name">${cat.emoji} ${cat.name}</div>
          <div class="mini-bar"><div class="mini-bar-fill" style="width:${p*100}%;background:${barColor}"></div></div>
        </div>
        <div class="cat-right">
          <div class="cat-bal ${balColor}">${fmt(bal)}</div>
          <div class="cat-spent">${fmt(s)} spent</div>
        </div>
      </div>`;
    }).join('');
  });
}

function renderCatSelect() {
  const sel = document.getElementById('log-cat');
  sel.innerHTML = state.categories.map(c =>
    `<option value="${c.id}">${c.emoji} ${c.name}</option>`
  ).join('');
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!state.transactions.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>No transactions yet.<br>Log an expense to get started.</p></div>`;
    return;
  }
  // Group by date
  const groups = {};
  [...state.transactions].reverse().forEach(t => {
    const d = new Date(t.date).toLocaleDateString('en-US', {weekday:'short',month:'short',day:'numeric'});
    if (!groups[d]) groups[d] = [];
    groups[d].push(t);
  });
  list.innerHTML = Object.entries(groups).map(([date, txs]) =>
    `<div class="date-group">${date}</div>
     <div class="card">
       ${txs.map(t => {
         const cat = state.categories.find(c => c.id === t.catId) || {};
         const color = SECTION_COLORS[cat.section] || '#8B95A3';
         return `<div class="tx-row">
           <div class="tx-icon" style="background:${color}22;color:${color}">${cat.emoji||'💰'}</div>
           <div class="tx-info">
             <div class="tx-cat">${cat.name||t.catId}</div>
             ${t.note ? `<div class="tx-note">${t.note}</div>` : ''}
             <div class="tx-date">${new Date(t.date).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</div>
           </div>
           <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
             <div class="tx-amount">-${fmt(t.amount)}</div>
             <div onclick="deleteTransaction('${t.id}')" style="font-size:11px;color:var(--text3);padding:2px 8px;background:var(--surface2);border-radius:6px;cursor:pointer;">Delete</div>
           </div>
         </div>`;
       }).join('')}
     </div>`
  ).join('');
}

function renderSettings() {
  document.getElementById('set-budget').textContent = fmt(totalBudget());
  const list = document.getElementById('cat-settings-list');
  list.innerHTML = state.categories.map(cat =>
    `<div class="settings-row" onclick="openEditCat('${cat.id}')">
      <span class="settings-label">${cat.emoji} ${cat.name}</span>
      <span class="settings-val">${fmt(cat.budget)}</span>
    </div>`
  ).join('');
}

function renderAll() {
  renderDashboard();
  renderCatSelect();
  renderHistory();
  renderSettings();
}

// ── Actions ────────────────────────────────────────────────────────────────
function logExpense() {
  const catId = document.getElementById('log-cat').value;
  const amount = parseFloat(document.getElementById('log-amount').value);
  const note = document.getElementById('log-note').value.trim();
  if (!amount || amount <= 0) { showToast('Enter a valid amount'); return; }
  const tx = { id: Date.now().toString(), catId, amount, note, date: new Date().toISOString() };
  state.transactions.push(tx);
  save();
  document.getElementById('log-amount').value = '';
  document.getElementById('log-note').value = '';
  renderAll();
  showToast('Expense added ✓');
  switchTabById('history');
}

function deleteTransaction(id) {
  state.transactions = state.transactions.filter(t => t.id !== id);
  save();
  renderAll();
  showToast('Transaction deleted');
}

function openEditCat(id) {
  const cat = state.categories.find(c => c.id === id);
  if (!cat) return;
  editingCatId = id;
  document.getElementById('modal-cat-title').textContent = `${cat.emoji} ${cat.name}`;
  document.getElementById('modal-cat-amount').value = cat.budget;
  openModal('modal-cat');
}

function saveCatBudget() {
  const val = parseFloat(document.getElementById('modal-cat-amount').value);
  if (isNaN(val) || val < 0) { showToast('Invalid amount'); return; }
  const cat = state.categories.find(c => c.id === editingCatId);
  if (cat) { cat.budget = val; save(); renderAll(); }
  closeModal('modal-cat');
  showToast('Budget updated ✓');
}

function openEditBudget() {
  document.getElementById('modal-budget-amount').value = totalBudget();
  openModal('modal-budget');
}

function saveBudget() {
  closeModal('modal-budget');
  showToast('Edit individual categories below');
}

function openCatDetail(id) {
  openEditCat(id);
}

function confirmReset() {
  document.getElementById('modal-confirm-title').textContent = 'Reset Transactions?';
  document.getElementById('modal-confirm-msg').textContent = 'This will delete all logged expenses. Your budget amounts will stay the same.';
  document.getElementById('modal-confirm-btn').onclick = () => { state.transactions = []; save(); renderAll(); closeModal('modal-confirm'); showToast('Transactions cleared'); };
  openModal('modal-confirm');
}

function confirmResetAll() {
  document.getElementById('modal-confirm-title').textContent = 'Reset Everything?';
  document.getElementById('modal-confirm-msg').textContent = 'This will reset all budget amounts and delete all transactions back to defaults.';
  document.getElementById('modal-confirm-btn').onclick = () => {
    state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    state.transactions = [];
    save(); renderAll(); closeModal('modal-confirm'); showToast('Reset to defaults');
  };
  openModal('modal-confirm');
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function switchTab(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
  document.getElementById('content').scrollTop = 0;
}

function switchTabById(name) {
  switchTab(name, document.getElementById('tab-' + name));
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Init ───────────────────────────────────────────────────────────────────
load();
renderAll();
</script>
</body>
</html>
